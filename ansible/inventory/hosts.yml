---
# Ansible se connecte directement dans les conteneurs (docker exec) : pas de SSH.
all:
  vars:
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3
  children:
    routers:
      hosts:
        router-fw:
    dns_servers:
      hosts:
        dns-lan:
    web_servers:
      hosts:
        web-dmz:
