---
# Miroir des adresses définies dans docker-compose.yml (source de vérité : compose).
configs_dir: "{{ playbook_dir }}/../../configs"
lab_domain: tp01.lab

net_dmz: 172.20.1.0/24
net_lan: 172.20.2.0/24
net_mgmt: 172.20.3.0/24

ip_fw_dmz: 172.20.1.1
ip_fw_lan: 172.20.2.1
ip_fw_mgmt: 172.20.3.1
ip_web: 172.20.1.10
ip_dns: 172.20.2.10
ip_client: 172.20.2.20
ip_admin: 172.20.3.10

dns_records:
  - { name: fw,     ip: 172.20.1.1 }
  - { name: web,    ip: 172.20.1.10 }
  - { name: dns,    ip: 172.20.2.10 }
  - { name: client, ip: 172.20.2.20 }
  - { name: admin,  ip: 172.20.3.10 }
